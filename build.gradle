plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // ./gradlew runClient -PquickWorld="New World"  -> loads straight into that save
            if (project.hasProperty('quickWorld')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickWorld').toString())
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime': mods present only when running runClient, never pulled by dependents or bundled.
dependencies {
    // Acedium Sodiumized (Nvidium port for NeoForge + Sodium 0.8) — compile only, not bundled
    compileOnly files("libs/${acedium_jar}")
    // Sodium 0.8.13 NeoForge inner mod jar — compile only, not bundled
    compileOnly files('libs/sodium-neoforge-0.8.13+mc1.21.1-mod.jar')
}

// runClient loads Acedium and Sodium from run/mods, exactly like the real game.
// Sodium must use its full distribution jar there: it is a LIBRARY that locates the inner
// mod jar and also carries classes the mod needs (compatibility.workarounds.*), so neither
// the wrapper nor the inner jar alone works from the dev classpath.
tasks.register('copyRunMods', Copy) {
    from("libs/${acedium_jar}")
    from('libs/run-mods')
    into('run/mods')
}
tasks.named('prepareClientRun') {
    dependsOn 'copyRunMods'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_version            : mod_version,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
